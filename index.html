<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyobMeaslik - Social & Live Platform</title>
  <link rel="icon" type="image/png" href="1785005468412.png">
  <link rel="apple-touch-icon" href="1785005468412.png">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #0f172a;
      color: #fff;
    }
    .btn-google {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .user-info {
      margin-top: 20px;
    }
    .user-info img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }
    .upload-section {
      margin-top: 30px;
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      max-width: 400px;
      width: 100%;
    }
    video {
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
      border-radius: 8px;
    }
    .post-card {
      background: #1e293b;
      margin: 20px auto;
      padding: 15px;
      border-radius: 10px;
      max-width: 400px;
      text-align: left;
    }
    .post-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .post-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <h1>EyobMeaslik Platform</h1>
  
  <!-- Google Sign In Button -->
  <div id="auth-container">
    <button class="btn-google" onclick="loginWithGoogle()">በ Google ሎጊን ግባ</button>
  </div>

  <!-- User Profile & Platform Area -->
  <div id="user-details" class="user-info" style="display:none;">
    <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
      <img id="user-photo" src="" alt="Profile Photo">
      <div>
        <h3 id="user-name" style="margin: 0;"></h3>
        <p id="user-email" style="margin: 5px 0 0 0; color: #94a3b8;"></p>
      </div>
    </div>
    
    <!-- Video Upload Section -->
    <div class="upload-section">
      <h3>ቪዲዮ ፖስት አድርግ</h3>
      <input type="file" id="video-file" accept="video/*"><br><br>
      <button onclick="uploadVideo()" style="padding: 10px 20px; background-color: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">አፕሎድ አድርግ</button>
      <p id="upload-status"></p>
    </div>

    <!-- Videos Feed -->
    <div id="videos-feed" style="margin-top: 30px;"></div>

    <br><br>
    <button onclick="logout()" style="padding: 8px 16px; background-color: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">ውጣ (Logout)</button>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCpp3ssr1KS5jMvgavBQ_U_zoZ84YJ-TPQ",
      authDomain: "eyobmeaslik.firebaseapp.com",
      projectId: "eyobmeaslik",
      storageBucket: "eyobmeaslik.firebasestorage.app",
      messagingSenderId: "401873040147",
      appId: "1:401873040147:web:b0c6767b648ef4178760e6",
      measurementId: "G-TMVVK7KVL4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          showUser(result.user);
        })
        .catch((error) => {
          alert("ሎጊን ማድረግ አልተቻለም፦ " + error.message);
        });
    }

    function showUser(user) {
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('user-details').style.display = 'block';
      document.getElementById('user-name').innerText = user.displayName;
      document.getElementById('user-email').innerText = user.email;
      document.getElementById('user-photo').src = user.photoURL;
      
      loadVideos(); // Load shared videos from Firestore
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        document.getElementById('auth-container').style.display = 'block';
        document.getElementById('user-details').style.display = 'none';
      });
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (user) showUser(user);
    });

    // Cloudinary Video Upload & Firestore Save Logic
    function uploadVideo() {
      const fileInput = document.getElementById('video-file');
      const statusText = document.getElementById('upload-status');
      
      if (fileInput.files.length === 0) {
        alert("እባክዎ መጀመሪያ ቪዲዮ ይምረጡ!");
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", "eyobpreset");

      statusText.innerText = "አፕሎድ እየተደረገ ነው... እባክዎ ይጠብቁ ⏳";

      fetch("https://api.cloudinary.com/v1_1/io5tahix/video/upload", {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.secure_url) {
          const user = firebase.auth().currentUser;
          
          // Save video metadata to Firestore database
          db.collection("videos").add({
            videoUrl: data.secure_url,
            userName: user ? user.displayName : "Anonymous",
            userPhoto: user ? user.photoURL : "",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          })
          .then(() => {
            statusText.innerText = "በስኬት ተጭኗል! ✅";
            fileInput.value = "";
            loadVideos();
          })
          .catch((error) => {
            statusText.innerText = "ዳታቤዝ ላይ ማስቀመጥ አልተቻለም።";
          });

        } else {
          statusText.innerText = "አፕሎድ ማድረግ አልተቻለም።";
        }
      })
      .catch(error => {
        console.error("Error:", error);
        statusText.innerText = "ስህተት ተፈጥሯል!";
      });
    }

    // Load Videos from Firestore Database
    function loadVideos() {
      const feed = document.getElementById('videos-feed');
      feed.innerHTML = "<h3>የተለቀቁ ቪዲዮዎች</h3>";

      db.collection("videos").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        querySnapshot.forEach((doc) => {
          const post = doc.data();
          
          const card = document.createElement('div');
          card.className = 'post-card';
          
          card.innerHTML = `
            <div class="post-header">
              <img src="${post.userPhoto || 'https://via.placeholder.com/40'}" alt="User">
              <div>
                <h4 style="margin:0;">${post.userName || 'User'}</h4>
              </div>
            </div>
            <video src="${post.videoUrl}" controls></video>
          `;
          
          feed.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
